<?xml version='1.0' encoding='UTF-8' ?>

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:param name="nombreEntidad" value="Rol" />
    <ui:param name="controller" value="#{rolModel}" />

    <ui:define name="titulo">
        Rol - Cafefe
    </ui:define>

    <ui:define name="tituloHeader">
        Rol
    </ui:define>

    <!-- TABLA -->
    <ui:define name="tabla">

        <p:dataTable id="tblRol"
                     value="#{rolModel.modelo}"
                     var="reg"
                     selection="#{rolModel.registro}"
                     rowKey="#{reg.idRol}"
                     selectionMode="single"
                     paginator="true"
                     rows="5"
                     paginatorPosition="both"
                     emptyMessage="No se encontraron registros"
                     styleClass="p-datatable-striped p-datatable-sm">

            <p:ajax event="rowSelect"
                    listener="#{rolModel.onRowSelect}"
                    update=":frmPrincipal" />

            <p:ajax event="rowUnselect"
                    listener="#{rolModel.onRowUnselect}"
                    update=":frmPrincipal" />

            <p:column headerText="ID">
                <h:outputText value="#{reg.idRol}" />
            </p:column>

            <p:column headerText="Nombre">
                <h:outputText value="#{reg.nombre}" />
            </p:column>

            <p:column headerText="Estado">
                <h:outputText value="#{reg.activo ? 'ACTIVO' : 'INACTIVO'}" />
            </p:column>

            <p:column headerText="Observaciones">
                <h:outputText value="#{reg.observaciones}" />
            </p:column>

        </p:dataTable>

    </ui:define>


    <!-- FORMULARIO -->
    <ui:define name="formulario">

        <p:panelGrid columns="2"
                     styleClass="ui-fluid"
                     style="width: 100%;">

            <p:outputLabel for="txtNombre"
                           value="Nombre:" />

            <p:inputText id="txtNombre"
                         value="#{rolModel.registro.nombre}"
                         required="true"
                         requiredMessage="El campo Nombre es obligatorio" />


            <p:outputLabel for="chkActivo"
                           value="Estado Activo:" />

            <p:selectBooleanCheckbox id="chkActivo"
                                     value="#{rolModel.registro.activo}" />


            <p:outputLabel for="txtObs"
                           value="Observaciones:" />

            <p:inputTextarea id="txtObs"
                             value="#{rolModel.registro.observaciones}"
                             rows="3"
                             autoResize="false" />

        </p:panelGrid>

    </ui:define>

</ui:composition>

<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://jakarta.faces.html"
                xmlns:f="http://jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://jakarta.faces.facelets"
                xmlns:b="http://xmlns.jcp.org/jsf/composite/botones"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        Empleado
    </ui:define>

    <!-- Usar el componente del Ing en la sección de botones -->
    <ui:define name="botones">
    <ui:include src="/WEB-INF/resources/botones/botones-arriba.xhtml" />
</ui:define>

    <ui:define name="contenido">
        <p:panelGrid id="pnlPestañas" columns="1" style="width:100%">
            <h:form id="frmTabla">
                <p:dataTable value="#{empleadoModel.modelo}" var="r" 
                             paginator="true" rows="10"
                             selectionMode="single" 
                             selection="#{empleadoModel.registro}" 
                             rowKey="#{r.idEmpleado}">

                    <p:ajax event="rowSelect" update=":frmDetalle" listener="#{empleadoModel.seleccionarRegistro}" />

                    <p:column headerText="ID">
                        <h:outputText value="#{r.idEmpleado}" />
                    </p:column>
                    <p:column headerText="Nombre">
                        <h:outputText value="#{r.nombre}" />
                    </p:column>
                    <p:column headerText="Apellido">
                        <h:outputText value="#{r.apellido}" />
                    </p:column>
                    <p:column headerText="Estado">
                        <h:outputText value="#{r.activo ? 'ACTIVO' : 'INACTIVO'}" />
                    </p:column>
                    <p:column headerText="Comentarios">
                        <h:outputText value="#{r.comentarios}" />
                    </p:column>
                </p:dataTable>
            </h:form>

            <h:panelGroup id="pnlDetalle">
                <h:form id="frmDetalle">
                    <p:messages id="messages" globalOnly="false" showDetail="true" showSummary="true" />

                    <p:panelGrid columns="2">
                        <p:outputLabel for="txtId" value="ID:" />
                        <p:inputText id="txtId" value="#{empleadoModel.registro.idEmpleado}" readonly="true" size="36" />

                        <p:outputLabel for="txtNombre" value="Nombre:" />
                        <p:inputText id="txtNombre" value="#{empleadoModel.registro.nombre}" required="true" />

                        <p:outputLabel for="txtApellido" value="Apellido:" />
                        <p:inputText id="txtApellido" value="#{empleadoModel.registro.apellido}" required="true" />

                        <p:outputLabel for="chkActivo" value="Activo:" />
                        <p:toggleSwitch id="chkActivo" value="#{empleadoModel.registro.activo}" />

                        <p:outputLabel for="txtComentarios" value="Observaciones:" />
                        <p:inputTextarea id="txtComentarios" rows="3" cols="30" value="#{empleadoModel.registro.comentarios}" />
                    </p:panelGrid>
                </h:form>
            </h:panelGroup>
        </p:panelGrid>
    </ui:define>

</ui:composition>

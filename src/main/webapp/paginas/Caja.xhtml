<?xml version='1.0' encoding='UTF-8' ?>

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:param name="nombreEntidad" value="Caja" />
    <ui:param name="controller" value="#{cajaModel}" />

    <ui:define name="titulo">
        Caja - Cafefe
    </ui:define>

    <ui:define name="tituloHeader">
        Caja
    </ui:define>


    <ui:define name="tabla">

        <p:dataTable id="tblCaja"
                     value="#{cajaModel.modelo}"
                     var="reg"
                     selection="#{cajaModel.registro}"
                     rowKey="#{reg.idCaja}"
                     selectionMode="single"
                     paginator="true"
                     rows="5"
                     paginatorPosition="both"
                     emptyMessage="No se encontraron registros"
                     styleClass="p-datatable-striped p-datatable-sm">

            <p:ajax event="rowSelect"
                    listener="#{cajaModel.onRowSelect}"
                    update="@form" />

            <p:ajax event="rowUnselect"
                    listener="#{cajaModel.onRowUnselect}"
                    update="@form" />


            <p:column headerText="ID"
                      style="width: 25%;">

                <h:outputText value="#{reg.idCaja}" />

            </p:column>


            <p:column headerText="Nombre">

                <h:outputText value="#{reg.nombre}" />

            </p:column>


            <p:column headerText="Estado">

                <h:outputText value="#{reg.activo ? 'ACTIVO' : 'INACTIVO'}" />

            </p:column>


            <p:column headerText="Observaciones">

                <h:outputText value="#{reg.observaciones}" />

            </p:column>

        </p:dataTable>

    </ui:define>


    <ui:define name="formulario">

        <div class="formgrid grid">


            <div class="field col-12 md:col-6">

                <p:outputLabel for="txtNombre"
                               value="Nombre"
                               styleClass="font-semibold block mb-2" />

                
        <p:inputText id="txtNombre"
             value="#{cajaModel.registro.nombre}"
             required="true"
             requiredMessage="El nombre es obligatorio"
             validatorMessage="El nombre debe tener entre 2 y 155 caracteres"
             maxlength="155"
             style="width: 100%;">

            <f:validateLength minimum="2" maximum="155" />

        </p:inputText>


            </div>


            <div class="field col-12">

                <p:outputLabel for="chkActivo"
                               value="Estado"
                               styleClass="font-semibold block mb-2" />

                <div class="flex align-items-center gap-2">

                    <p:selectBooleanCheckbox id="chkActivo"
                                             value="#{cajaModel.registro.activo}" />

                    <h:outputText value="Caja activa" />

                </div>

            </div>


            <div class="field col-12">

                <p:outputLabel for="txtObs"
                               value="Observaciones"
                               styleClass="font-semibold block mb-2" />

                <p:inputTextarea id="txtObs"
                                 value="#{cajaModel.registro.observaciones}"
                                 rows="4"
                                 autoResize="false"
                                 style="width: 100%;"
                                 placeholder="Agregue información adicional..." />

            </div>

        </div>

    </ui:define>

</ui:composition>

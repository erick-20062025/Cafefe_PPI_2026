<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/WEB-INF/plantillas/general.xhtml">

    <ui:param
        name="nombreEntidad"
        value="Orden"/>

    <ui:param
        name="controller"
        value="#{ordenModel}"/>

    <ui:define name="titulo">
        Órdenes - Cafefe
    </ui:define>

    <ui:define name="tituloHeader">
        Órdenes
    </ui:define>


    <!-- ===================================================== -->
    <!-- LISTADO DE ÓRDENES                                    -->
    <!-- ===================================================== -->

    <ui:define name="tabla">

        <p:dataTable
            id="tablaOrdenes"
            value="#{ordenModel.modelo}"
            var="orden"
            selection="#{ordenModel.registro}"
            rowKey="#{orden.idOrden}"
            selectionMode="single"
            paginator="true"
            rows="10"
            emptyMessage="No hay órdenes registradas">

            <p:ajax
                event="rowSelect"
                listener="#{ordenModel.onRowSelect}"
                update="@form"/>

            <p:ajax
                event="rowUnselect"
                listener="#{ordenModel.onRowUnselect}"
                update="@form"/>


            <p:column
                headerText="Fecha"
                sortBy="#{orden.fechaCreacion}">

                <h:outputText
                    value="#{orden.fechaCreacion}">

                    <f:convertDateTime
                        pattern="dd/MM/yyyy"
                        timeZone="America/El_Salvador"/>

                </h:outputText>

            </p:column>


            <p:column headerText="Empleado">

                <h:outputText
                    value="#{orden.idEmpleadoRol.idEmpleado.nombre} #{orden.idEmpleadoRol.idEmpleado.apellido}"/>

            </p:column>


            <p:column headerText="Rol">

                <h:outputText
                    value="#{orden.idEmpleadoRol.idRol.nombre}"/>

            </p:column>

        </p:dataTable>


        <!-- ================================================= -->
        <!-- MODAL: VER ORDEN                                  -->
        <!-- ================================================= -->

        <p:dialog
            id="dlgDetalleOrden"
            widgetVar="dlgDetalleOrdenWV"
            header="Detalle de la orden"
            modal="true"
            responsive="true"
            width="900"
            closable="true"
            resizable="false">

            <div style="max-height: 70vh; overflow-y: auto; padding-right: 0.5rem;">

                <h:panelGroup
                    rendered="#{ordenModel.ordenSeleccionadaConsulta != null}">

                    <div class="formgrid grid mb-3">

                        <div class="field col-12 md:col-4">

                            <strong>Fecha</strong>
                            <br/>

                            <h:outputText
                                value="#{ordenModel.ordenSeleccionadaConsulta.fechaCreacion}">

                                <f:convertDateTime
                                    pattern="dd/MM/yyyy"
                                    timeZone="America/El_Salvador"/>

                            </h:outputText>

                        </div>


                        <div class="field col-12 md:col-4">

                            <strong>Empleado</strong>
                            <br/>

                            <h:outputText
                                value="#{ordenModel.ordenSeleccionadaConsulta.idEmpleadoRol.idEmpleado.nombre} #{ordenModel.ordenSeleccionadaConsulta.idEmpleadoRol.idEmpleado.apellido}"/>

                        </div>


                        <div class="field col-12 md:col-4">

                            <strong>Rol</strong>
                            <br/>

                            <h:outputText
                                value="#{ordenModel.ordenSeleccionadaConsulta.idEmpleadoRol.idRol.nombre}"/>

                        </div>

                    </div>


                    <!-- PRODUCTOS DE LA ORDEN CONSULTADA -->

                    <p:dataTable
                        value="#{ordenModel.productosConsulta}"
                        var="detalle"
                        paginator="true"
                        rows="8"
                        paginatorPosition="bottom"
                        emptyMessage="La orden no tiene productos registrados">

                        <p:column headerText="Producto">

                            <h:outputText
                                value="#{detalle.idProducto.nombre}"/>

                        </p:column>


                        <p:column
                            headerText="Precio actual"
                            style="width: 150px;">

                            <h:outputText
                                value="#{detalle.precio}">

                                <f:convertNumber
                                    type="currency"
                                    currencySymbol="$"
                                    minFractionDigits="2"
                                    maxFractionDigits="2"/>

                            </h:outputText>

                        </p:column>


                        <p:column headerText="Observaciones">

                            <h:outputText
                                value="#{detalle.observaciones}"
                                style="white-space: pre-line;"/>

                        </p:column>

                    </p:dataTable>


                    <!-- TOTAL -->

                    <div class="flex justify-content-end mt-3">

                        <h:outputText
                            value="Total actual: "
                            style="font-weight: bold;
                            margin-right: 0.5rem;"/>

                        <h:outputText
                            value="#{ordenModel.totalConsulta}"
                            style="font-weight: bold;">

                            <f:convertNumber
                                type="currency"
                                currencySymbol="$"
                                minFractionDigits="2"
                                maxFractionDigits="2"/>

                        </h:outputText>

                    </div>

                </h:panelGroup>

            </div>


            <f:facet name="footer">

                <p:commandButton
                    value="Cerrar"
                    type="button"
                    icon="pi pi-times"
                    onclick="PF('dlgDetalleOrdenWV').hide();"
                    styleClass="ui-button-secondary"/>

            </f:facet>

        </p:dialog>

    </ui:define>


    <!-- ===================================================== -->
    <!-- ACCIÓN EXTRA: VER ORDEN                               -->
    <!-- ===================================================== -->

    <ui:define name="accionesListadoEspeciales">

        <p:commandButton
            id="btnVerOrden"
            value="Ver orden"
            icon="pi pi-eye"
            action="#{ordenModel.verOrden}"
            process="@this"
            update=":frmPrincipal:dlgDetalleOrden"
            disabled="#{ordenModel.registro == null}"
            oncomplete="PF('dlgDetalleOrdenWV').show();"
            styleClass="ui-button-secondary mr-2"/>

    </ui:define>


    <!-- ===================================================== -->
    <!-- FORMULARIO NUEVO / EDITAR                             -->
    <!-- ===================================================== -->

    <ui:define name="formulario">


        <!-- ================================================= -->
        <!-- DATOS GENERALES                                   -->
        <!-- ================================================= -->

        <p:panel
            header="Datos generales"
            styleClass="mb-4">

            <div class="formgrid grid">


                <!-- EMPLEADO / CAMARERO -->

                <div class="field col-12 md:col-6">

                    <p:outputLabel
                        for="cmbEmpleadoRol"
                        value="Empleado y rol"/>

                    <p:selectOneMenu
                        id="cmbEmpleadoRol"
                        value="#{ordenModel.idEmpleadoRolSeleccionado}"
                        disabled="#{ordenModel.editando}"
                        required="true"
                        requiredMessage="Debe seleccionar un empleado con rol camarero"
                        filter="true"
                        filterMatchMode="contains"
                        caseSensitive="false"
                        filterNormalize="true"
                        filterPlaceholder="Buscar..."
                        style="width: 100%;">

                        <f:selectItem
                            itemLabel="Seleccione un camarero"
                            itemValue="#{null}"
                            noSelectionOption="true"/>

                        <f:selectItems
                            value="#{ordenModel.empleadosRol}"
                            var="empleadoRol"
                            itemLabel="#{empleadoRol.idEmpleado.nombre} #{empleadoRol.idEmpleado.apellido} - #{empleadoRol.idRol.nombre}"
                            itemValue="#{empleadoRol.idEmpleadoRol.toString()}"
                            itemDisabled="#{not empleadoRol.activo
                                            or not empleadoRol.idEmpleado.activo
                                            or not empleadoRol.idRol.activo}"/>

                    </p:selectOneMenu>

                    <small class="text-color-secondary">
                        Solo se muestran empleados activos con rol camarero.
                    </small>

                </div>


                <!-- FECHA -->

                <div class="field col-12 md:col-6">

                    <p:outputLabel
                        for="fechaOrden"
                        value="Fecha de la orden"/>

                    <p:datePicker
                        id="fechaOrden"
                        value="#{ordenModel.registro.fechaCreacion}"
                        pattern="dd/MM/yyyy"
                        showIcon="true"
                        disabled="#{ordenModel.editando}"
                        required="true"
                        requiredMessage="Debe indicar la fecha de la orden"
                        style="width: 100%;"/>

                    <small class="text-color-secondary">

                        <h:outputText
                            rendered="#{ordenModel.nuevo}"
                            value="Puede seleccionar fechas pasadas, de hoy o futuras."/>

                        <h:outputText
                            rendered="#{ordenModel.editando}"
                            value="La fecha no puede modificarse después de crear la orden."/>

                    </small>

                </div>

            </div>

        </p:panel>


        <!-- ================================================= -->
        <!-- CREACIÓN: TODAVÍA SIN PRODUCTOS                    -->
        <!-- ================================================= -->

        <p:panel
            header="Productos de la orden"
            rendered="#{ordenModel.nuevo}"
            styleClass="mb-4">

            <h:panelGroup
                layout="block"
                style="padding: 1rem;
                border: 1px solid #d6d6d6;
                border-radius: 6px;
                background-color: #f8f9fa;">

                <i
                    class="pi pi-info-circle"
                    style="margin-right: 0.5rem;"></i>

                <h:outputText
                    value="Primero guarde la orden. Después selecciónela y presione Editar para agregar productos y aplicar descuentos."/>

            </h:panelGroup>

        </p:panel>


        <!-- ================================================= -->
        <!-- ADMINISTRACIÓN DE PRODUCTOS                        -->
        <!-- ================================================= -->

        <h:panelGroup
            id="pnlGestionProductos"
            layout="block"
            rendered="#{ordenModel.puedeGestionarProductos}">


            <!-- ============================================= -->
            <!-- AGREGAR PRODUCTO                              -->
            <!-- ============================================= -->

            <p:panel
                header="Agregar producto"
                styleClass="mb-4">

                <div class="formgrid grid">


                    <!-- PRODUCTO -->

                    <div class="field col-12 md:col-5">

                        <p:outputLabel
                            for="cmbProducto"
                            value="Producto"/>

                        <p:selectOneMenu
                            id="cmbProducto"
                            value="#{ordenModel.idProductoSeleccionado}"
                        filter="true"
                        filterMatchMode="contains"
                        caseSensitive="false"
                        filterNormalize="true"
                        filterPlaceholder="Buscar..."
                            style="width: 100%;">

                            <f:selectItem
                                itemLabel="Seleccione un producto"
                                itemValue="#{null}"
                                noSelectionOption="true"/>

                            <f:selectItems
                                value="#{ordenModel.productosDisponibles}"
                                var="producto"
                                itemLabel="#{producto.nombre}"
                                itemValue="#{producto.idProducto.toString()}"
                                itemDisabled="#{not producto.activo}"/>

                            <p:ajax
                                process="@this"
                                update="txtPrecioProducto"/>

                        </p:selectOneMenu>

                    </div>


                    <!-- PRECIO -->

                    <div class="field col-12 md:col-3">

                        <p:outputLabel
                            for="txtPrecioProducto"
                            value="Precio sugerido"/>

                        <p:inputNumber
                            id="txtPrecioProducto"
                            value="#{ordenModel.precioProducto}"
                            decimalPlaces="2"
                            readonly="true"
                            symbol="$"
                            symbolPosition="p"
                            style="width: 100%;"/>

                    </div>


                    <!-- OBSERVACIONES -->

                    <div class="field col-12 md:col-4">

                        <p:outputLabel
                            for="txtObservacionesProducto"
                            value="Observaciones"/>

                        <p:inputTextarea
                            id="txtObservacionesProducto"
                            value="#{ordenModel.observacionesProducto}"
                            maxlength="500"
                            autoResize="false"
                            rows="2"
                            placeholder="Ej. sin azúcar"
                            style="width: 100%;"/>

                    </div>


                    <!-- AGREGAR -->

                    <div class="field col-12">

                        <p:commandButton
                            value="Agregar producto"
                            icon="pi pi-plus"
                            action="#{ordenModel.agregarProducto}"
                            process="cmbProducto txtObservacionesProducto"
                            update="@form"
                            styleClass="ui-button-success"/>

                    </div>

                </div>

            </p:panel>


            <!-- ============================================= -->
            <!-- PRODUCTOS DE LA ORDEN                         -->
            <!-- ============================================= -->

            <p:panel
                header="Productos de la orden"
                styleClass="mb-4">

                <p:dataTable
                    id="tablaProductosOrden"
                    value="#{ordenModel.productosOrden}"
                    var="detalle"
                    paginator="true"
                    rows="8"
                    paginatorPosition="bottom"
                    emptyMessage="La orden todavía no tiene productos">


                    <!-- PRODUCTO -->

                    <p:column headerText="Producto">

                        <h:outputText
                            value="#{detalle.idProducto.nombre}"/>

                    </p:column>


                    <!-- PRECIO ACTUAL -->

                    <p:column
                        headerText="Precio actual"
                        style="width: 150px;">

                        <h:outputText
                            value="#{detalle.precio}">

                            <f:convertNumber
                                type="currency"
                                currencySymbol="$"
                                minFractionDigits="2"
                                maxFractionDigits="2"/>

                        </h:outputText>

                    </p:column>


                    <!-- OBSERVACIONES -->

                    <p:column headerText="Observaciones">

                        <h:outputText
                            value="#{detalle.observaciones}"
                            style="white-space: pre-line;"/>

                    </p:column>


                    <!-- ACCIONES -->

                    <p:column
                        headerText="Acciones"
                        style="width: 130px; text-align: center;">




                        <!-- QUITAR PRODUCTO -->

                        <p:commandButton
                            icon="pi pi-trash"
                            title="Quitar producto"
                            action="#{ordenModel.quitarProducto(detalle)}"
                            process="@this"
                            update="@form"
                            styleClass="ui-button-danger">

                            <p:confirm
                                header="Quitar producto"
                                message="¿Desea quitar este producto de la orden?"
                                icon="pi pi-exclamation-triangle"/>

                        </p:commandButton>

                    </p:column>

                </p:dataTable>


                <!-- ================================================= -->
                <!-- PROMOCIONES GENERALES DE LA ORDEN                  -->
                <!-- ================================================= -->
                <p:panel header="Aplicar descuento a la orden" styleClass="mt-4 mb-4">
                    <h:panelGroup rendered="#{empty ordenModel.promocionesDisponibles}">
                        <h:outputText value="No hay descuentos aplicables a los productos de esta orden en la fecha seleccionada."/>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{not empty ordenModel.promocionesDisponibles}">
                        <div class="formgrid grid">
                            <div class="field col-12 md:col-8">
                                <p:outputLabel for="cmbPromocion" value="Descuento para la orden"/>
                                <p:selectOneMenu
                                    id="cmbPromocion"
                                    value="#{ordenModel.idPromocionSeleccionada}"
                                    filter="true"
                                    filterMatchMode="contains"
                                    caseSensitive="false"
                                    filterNormalize="true"
                                    filterPlaceholder="Buscar descuento..."
                                    style="width: 100%;">
                                    <f:selectItem itemLabel="Seleccione un descuento"
                                                  itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{ordenModel.promocionesDisponibles}"
                                                   var="promocion"
                                                   itemLabel="#{promocion.nombre}"
                                                   itemValue="#{promocion.idDescuento.toString()}"/>
                                </p:selectOneMenu>
                            </div>
                            <div class="field col-12 md:col-4">
                                <p:outputLabel value="Acción"/>
                                <p:commandButton value="Aplicar descuento"
                                                 icon="pi pi-percentage"
                                                 action="#{ordenModel.aplicarPromocion}"
                                                 process="@this cmbPromocion"
                                                 update="@form"
                                                 styleClass="ui-button-warning"
                                                 style="width:100%;">
                                    <p:confirm header="Confirmar descuento"
                                               message="¿Aplicar esta promoción a todos los productos elegibles de la orden? Si ya se aplicó antes, se calculará sobre los precios actuales."
                                               icon="pi pi-exclamation-triangle"/>
                                </p:commandButton>
                            </div>
                        </div>
                        <small class="text-color-secondary">
                            La promoción se aplica a todos los productos asociados y vigentes.
                            Los productos no elegibles conservan su precio.
                            Puede aplicar la misma promoción otra vez sobre los importes ya rebajados.
                        </small>
                    </h:panelGroup>
                </p:panel>

                <!-- TOTAL -->

                <div class="flex justify-content-end mt-3">

                    <h:outputText
                        value="Total actual: "
                        style="font-weight: bold;
                        font-size: 1.1rem;
                        margin-right: 0.5rem;"/>

                    <h:outputText
                        id="txtTotalOrden"
                        value="#{ordenModel.totalOrden}"
                        style="font-weight: bold;
                        font-size: 1.1rem;">

                        <f:convertNumber
                            type="currency"
                            currencySymbol="$"
                            minFractionDigits="2"
                            maxFractionDigits="2"/>

                    </h:outputText>

                </div>

            </p:panel>




        </h:panelGroup>

    </ui:define>

</ui:composition>

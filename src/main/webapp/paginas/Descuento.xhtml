<?xml version='1.0' encoding='UTF-8' ?>

<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:h="jakarta.faces.html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="jakarta.faces.core"
    template="/WEB-INF/plantillas/general.xhtml">

    <ui:param
        name="nombreEntidad"
        value="Descuento"/>

    <ui:param
        name="controller"
        value="#{descuentoModel}"/>

    <ui:define name="titulo">
        Descuentos - Cafefe
    </ui:define>

    <ui:define name="tituloHeader">
        Descuentos
    </ui:define>


    <!-- ====================================================== -->
    <!-- TABLA PRINCIPAL                                       -->
    <!-- ====================================================== -->

    <ui:define name="tabla">

        <p:dataTable
            id="tblDescuento"
            value="#{descuentoModel.modelo}"
            var="reg"
            selection="#{descuentoModel.registro}"
            rowKey="#{reg.idDescuento}"
            selectionMode="single"
            paginator="true"
            rows="5"
            paginatorPosition="both"
            emptyMessage="No se encontraron registros"
            styleClass="p-datatable-striped p-datatable-sm">

            <p:ajax
                event="rowSelect"
                listener="#{descuentoModel.onRowSelect}"
                update="@form"/>

            <p:ajax
                event="rowUnselect"
                listener="#{descuentoModel.onRowUnselect}"
                update="@form"/>

            <p:column
                headerText="ID"
                style="width: 22%;">

                <h:outputText
                    value="#{reg.idDescuento}"/>

            </p:column>

            <p:column
                headerText="Nombre">

                <h:outputText
                    value="#{reg.nombre}"/>

            </p:column>

            <p:column
                headerText="Tipo de descuento">

                <h:outputText
                    value="#{descuentoModel.obtenerNombreTipoDescuento(reg.idTipoDescuento)}"/>

            </p:column>

            <p:column
                headerText="Fecha desde">

                <h:outputText
                    value="#{reg.fechaDesde}">

                    <f:convertDateTime
                        pattern="dd/MM/yyyy"/>

                </h:outputText>

            </p:column>

            <p:column
                headerText="Fecha hasta">

                <h:outputText
                    value="Sin límite"
                    rendered="#{empty reg.fechaHasta}"/>

                <h:outputText
                    value="#{reg.fechaHasta}"
                    rendered="#{not empty reg.fechaHasta}">

                    <f:convertDateTime
                        pattern="dd/MM/yyyy"/>

                </h:outputText>

            </p:column>

            <p:column
                headerText="Observaciones">

                <h:outputText
                    value="#{reg.observaciones}"/>

            </p:column>

        </p:dataTable>

    </ui:define>


    <!-- ====================================================== -->
    <!-- FORMULARIO                                             -->
    <!-- ====================================================== -->

    <ui:define name="formulario">

        <p:tabView
            id="tabDescuento">


            <!-- ================================================== -->
            <!-- DATOS DEL DESCUENTO                                -->
            <!-- ================================================== -->

            <p:tab
                title="Datos del descuento">

                <div class="formgrid grid">

                    <div class="field col-12 md:col-6">

                        <p:outputLabel
                            for="txtNombre"
                            value="Nombre"
                            styleClass="font-semibold block mb-2"/>

                        <p:inputText
                            id="txtNombre"
                            value="#{descuentoModel.registro.nombre}"
                            required="true"
                            requiredMessage="El campo Nombre es obligatorio"
                            validatorMessage="El nombre debe contener al menos 2 caracteres"
                            maxlength="155"
                            style="width: 100%;">

                            <f:validateLength
                                minimum="2"
                                maximum="155"/>

                        </p:inputText>

                    </div>


                    <div class="field col-12 md:col-6">

                        <p:outputLabel
                            for="cmbTipoDescuento"
                            value="Tipo de descuento"
                            styleClass="font-semibold block mb-2"/>

                        <p:selectOneMenu
                            id="cmbTipoDescuento"
                            value="#{descuentoModel.idTipoDescuentoSeleccionado}"
                            required="true"
                            requiredMessage="Debe seleccionar un tipo de descuento"
                            disabled="#{descuentoModel.editando}"
                            style="width: 100%;">

                            <f:selectItem
                                itemLabel="Seleccione un tipo"
                                itemValue=""
                                noSelectionOption="true"/>

                            <f:selectItems
                                value="#{descuentoModel.tiposDescuento}"
                                var="tipo"
                                itemLabel="#{descuentoModel.obtenerEtiquetaTipoDescuento(tipo)}"
                                itemValue="#{tipo.idTipoDescuento.toString()}"
                                itemDisabled="#{not tipo.activo}"/>

                        </p:selectOneMenu>

                        <h:outputText
                            value="El tipo de descuento no puede modificarse después de crear el descuento."
                            rendered="#{descuentoModel.editando}"
                            style="
                                display: block;
                                margin-top: 0.4rem;
                                font-size: 0.85rem;
                                color: #6c757d;"/>

                    </div>


                    <div class="field col-12 md:col-6">

                        <p:outputLabel
                            for="fechaDesde"
                            value="Fecha desde"
                            styleClass="font-semibold block mb-2"/>

                        <p:datePicker
                            id="fechaDesde"
                            value="#{descuentoModel.registro.fechaDesde}"
                            pattern="dd/MM/yyyy"
                            showIcon="true"
                            required="true"
                            requiredMessage="La fecha desde es obligatoria"
                            mindate="#{descuentoModel.nuevo ? descuentoModel.fechaMinima : null}"
                            style="width: 100%;">

                            <p:ajax
                                event="dateSelect"
                                update="fechaHasta"/>

                        </p:datePicker>

                    </div>


                    <div class="field col-12 md:col-6">

                        <p:outputLabel
                            for="fechaHasta"
                            value="Fecha hasta (opcional)"
                            styleClass="font-semibold block mb-2"/>

                        <p:datePicker
                            id="fechaHasta"
                            value="#{descuentoModel.registro.fechaHasta}"
                            pattern="dd/MM/yyyy"
                            showIcon="true"
                            disabled="#{empty descuentoModel.registro.fechaDesde}"
                            mindate="#{descuentoModel.registro.fechaDesde}"
                            placeholder="Sin fecha = rango abierto"
                            style="width: 100%;"/>

                        <h:outputText
                            value="Déjela vacía si el descuento no tiene fecha de finalización."
                            style="
                                display: block;
                                margin-top: 0.4rem;
                                font-size: 0.85rem;
                                color: #6c757d;"/>

                    </div>


                    <div class="field col-12">

                        <p:outputLabel
                            for="txtObs"
                            value="Observaciones"
                            styleClass="font-semibold block mb-2"/>

                        <p:inputTextarea
                            id="txtObs"
                            value="#{descuentoModel.registro.observaciones}"
                            rows="4"
                            autoResize="false"
                            style="width: 100%;"
                            placeholder="Agregue información adicional..."/>

                    </div>

                </div>

            </p:tab>


        </p:tabView>

    </ui:define>

</ui:composition>

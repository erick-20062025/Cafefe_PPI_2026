<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:param name="nombreEntidad" value="Descuento" />
    <ui:param name="controller" value="#{descuentoModel}" />

    <ui:define name="titulo">Descuentos - Cafefe</ui:define>
    <ui:define name="tituloHeader">Descuentos</ui:define>

    <ui:define name="tabla">

        <p:dataTable id="tblDescuento"
                     value="#{descuentoModel.modelo}"
                     var="reg"
                     selection="#{descuentoModel.registro}"
                     rowKey="#{reg.idDescuento}"
                     selectionMode="single"
                     paginator="true"
                     rows="5"
                     paginatorPosition="both"
                     emptyMessage="No se encontraron registros"
                     styleClass="p-datatable-striped p-datatable-sm">

            <p:ajax event="rowSelect"
                    listener="#{descuentoModel.onRowSelect}"
                    update="@form" />

            <p:ajax event="rowUnselect"
                    listener="#{descuentoModel.onRowUnselect}"
                    update="@form" />

            <p:column headerText="ID" style="width: 25%;">
                <h:outputText value="#{reg.idDescuento}" />
            </p:column>

            <p:column headerText="Nombre">
                <h:outputText value="#{reg.nombre}" />
            </p:column>

            <p:column headerText="Fecha desde">
                <h:outputText value="#{reg.fechaDesde}">
                    <f:convertDateTime pattern="dd/MM/yyyy" />
                </h:outputText>
            </p:column>

            <p:column headerText="Fecha hasta">
                <h:outputText value="#{reg.fechaHasta}">
                    <f:convertDateTime pattern="dd/MM/yyyy" />
                </h:outputText>
            </p:column>

            <p:column headerText="Observaciones">
                <h:outputText value="#{reg.observaciones}" />
            </p:column>

        </p:dataTable>

    </ui:define>


    <ui:define name="formulario">

        <div class="formgrid grid">

            <div class="field col-12 md:col-6">

                <p:outputLabel for="txtNombre"
                               value="Nombre"
                               styleClass="font-semibold block mb-2" />

                <p:inputText id="txtNombre"
                             value="#{descuentoModel.registro.nombre}"
                             required="true"
                             requiredMessage="El campo Nombre es obligatorio"
                             validatorMessage="El nombre debe contener al menos 2 caracteres"
                             maxlength="155"
                             style="width: 100%;">

                    <f:validateLength minimum="2" maximum="155" />

                </p:inputText>

            </div>


            <div class="field col-12 md:col-6">

                <p:outputLabel for="cmbTipoDescuento"
                               value="Tipo de descuento"
                               styleClass="font-semibold block mb-2" />

                <p:selectOneMenu id="cmbTipoDescuento"
                                 value="#{descuentoModel.idTipoDescuentoSeleccionado}"
                                 required="true"
                                 requiredMessage="Debe seleccionar un tipo de descuento"
                                 style="width: 100%;">

                    <f:selectItem itemLabel="Seleccione un tipo"
                                  itemValue=""
                                  noSelectionOption="true" />

                    <f:selectItems value="#{descuentoModel.tiposDescuento}"
                                   var="tipo"
                                   itemLabel="#{tipo.nombre}"
                                   itemValue="#{tipo.idTipoDescuento.toString()}" />

                </p:selectOneMenu>

            </div>


            <div class="field col-12 md:col-6">

                <p:outputLabel for="fechaDesde"
                               value="Fecha desde"
                               styleClass="font-semibold block mb-2" />

                <p:datePicker id="fechaDesde"
                              value="#{descuentoModel.registro.fechaDesde}"
                              pattern="dd/MM/yyyy"
                              showIcon="true"
                              required="true"
                              requiredMessage="La fecha desde es obligatoria"
                              style="width: 100%;">

                    <p:ajax event="dateSelect"
                            listener="#{descuentoModel.actualizarFechaHasta}"
                            update="fechaHasta" />

                </p:datePicker>

            </div>


            <div class="field col-12 md:col-6">

                <p:outputLabel for="fechaHasta"
                               value="Fecha hasta"
                               styleClass="font-semibold block mb-2" />

                <p:datePicker id="fechaHasta"
                              value="#{descuentoModel.registro.fechaHasta}"
                              pattern="dd/MM/yyyy"
                              showIcon="true"
                              required="true"
                              requiredMessage="La fecha hasta es obligatoria"
                              disabled="#{empty descuentoModel.registro.fechaDesde}"
                              mindate="#{descuentoModel.registro.fechaDesde}"
                              style="width: 100%;" />   

            </div>

            <div class="field col-12">

                <p:outputLabel for="txtObs"
                               value="Observaciones"
                               styleClass="font-semibold block mb-2" />

                <p:inputTextarea id="txtObs"
                                 value="#{descuentoModel.registro.observaciones}"
                                 rows="4"
                                 autoResize="false"
                                 style="width: 100%;"
                                 placeholder="Agregue información adicional..." />

            </div>

        </div>

    </ui:define>

</ui:composition>

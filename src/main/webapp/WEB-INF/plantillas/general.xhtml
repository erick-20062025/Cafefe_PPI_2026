<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>
            <ui:insert name="titulo">Cafefe</ui:insert>
        </title>

        <link rel="stylesheet"
              href="https://unpkg.com/primeflex@3.3.1/primeflex.min.css" />
        <style>
            .cafefe-toast .ui-growl-item-container {
                background: #d97706 !important;
                border: 1px solid #b45309 !important;
                border-radius: 10px !important;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18) !important;
            }

            .cafefe-toast .ui-growl-title,
            .cafefe-toast .ui-growl-message,
            .cafefe-toast .ui-growl-message p,
            .cafefe-toast .ui-growl-icon-close {
                color: white !important;
            }

            .cafefe-toast .ui-growl-item {
                padding: 1rem !important;
            }
            .menu-superior {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 10px;
            }

            .boton-superior {
                font-size: 0.9rem !important;
                border-radius: 8px !important;
                padding: 0.55rem 0.85rem !important;
            }

            .boton-superior:hover {
                background-color: rgba(255, 255, 255, 0.15) !important;
            }
            .menu-lateral {
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding-right: 1rem;
            }

            .menu-titulo {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: bold;
                color: #5d4037;
                margin-bottom: 12px;
            }

            .menu-seccion {
                font-size: 0.8rem;
                font-weight: bold;
                text-transform: uppercase;
                color: #6b7280;
                margin-top: 14px;
                margin-bottom: 3px;
                padding-left: 4px;
            }

            .boton-menu {
                width: 100% !important;
                justify-content: flex-start !important;
                text-align: left !important;
                background: transparent !important;
                color: #4b5563 !important;
                border: none !important;
                box-shadow: none !important;
                border-radius: 8px !important;
            }

            .boton-menu:hover {
                background: #f3eee8 !important;
                color: #3f6212 !important;
            }

            .boton-menu .ui-button-text {
                text-align: left !important;
                flex: 1;
            }
        </style>

    </h:head>
    <script type="text/javascript">
        function toggleMenu() {

            const contenido = document.getElementById('contenidoMenu');
            const titulo = document.getElementById('tituloMenu');
            const menu = document.getElementById('contenedorMenu');
            const principal = document.getElementById('areaPrincipal');

            const oculto = contenido.style.display === 'none';

            if (oculto) {
                contenido.style.display = '';
                titulo.style.display = '';
                menu.classList.remove('md:col-1');
                menu.classList.add('md:col-2');
                principal.classList.remove('md:col-11');
                principal.classList.add('md:col-10');
            } else {
                contenido.style.display = 'none';
                titulo.style.display = 'none';
                menu.classList.remove('md:col-2');
                menu.classList.add('md:col-1');
                principal.classList.remove('md:col-10');
                principal.classList.add('md:col-11');
            }
        }
    </script>

    <h:body>

        <h:form id="frmPrincipal">
            <p:growl id="growl"
                     showDetail="true"
                     life="4000" />

            <div class="grid p-3">

                <!-- ENCABEZADO SUPERIOR -->
                <div class="col-12 flex align-items-center justify-content-between pb-3 border-bottom-1 surface-border">

                    <div class="flex align-items-center">
                        <h:graphicImage name="imagenes/200LogoCafefe.png"
                                        alt="Cafefe Logo"
                                        style="height: 80px; width: auto;" />
                    </div>

                    <div>
                        <h1 class="text-2xl font-normal m-0">
                            <ui:insert name="tituloHeader">
                                Título Vista
                            </ui:insert>
                        </h1>
                    </div>

                    <div class="menu-superior">

                        <p:commandButton value="Español"
                                         icon="pi pi-globe"
                                         type="button"
                                         styleClass="ui-button-flat boton-superior" />

                        <p:commandButton value="Iniciar sesión"
                                         icon="pi pi-user"
                                         type="button"
                                         styleClass="ui-button-flat boton-superior" />

                    </div>

                </div>


                <!-- CONTENIDO PRINCIPAL -->
                <div class="col-12 grid mt-3">

                    <!-- MENÚ LATERAL -->
                    <div id="contenedorMenu"
                         class="col-12 md:col-2">

                        <div class="menu-lateral">

                            <div class="menu-titulo">

                                <p:commandButton
                                    type="button"
                                    icon="pi pi-bars"
                                    title="Mostrar/Ocultar menú"
                                    onclick="toggleMenu();"
                                    styleClass="ui-button-flat ui-button-secondary" />

                                <span id="tituloMenu">
                                    Menú navegación
                                </span>

                            </div>

                            <div id="contenidoMenu">

                                <p:button value="Cajas"
                                          outcome="/paginas/Caja.xhtml"
                                          icon="pi pi-wallet"
                                          styleClass="boton-menu" />

                                <p:button value="Órdenes"
                                          outcome="/paginas/Orden.xhtml"
                                          icon="pi pi-shopping-cart"
                                          styleClass="boton-menu" />
                                <p:button value="Facturas"
                                          outcome="/paginas/Factura.xhtml"
                                          icon="pi pi-file"
                                          styleClass="boton-menu" />


                                <!-- CATÁLOGO -->
                                <div class="menu-seccion">
                                    Catálogo
                                </div>

                                <p:button value="Productos"
                                          outcome="/paginas/Producto.xhtml"
                                          icon="pi pi-box"
                                          styleClass="boton-menu" />

                                <p:button value="Tipos de producto"
                                          outcome="/paginas/TipoProducto.xhtml"
                                          icon="pi pi-tags"
                                          styleClass="boton-menu" />

                                <p:button value="Características"
                                          outcome="/paginas/Caracteristica.xhtml"
                                          icon="pi pi-list"
                                          styleClass="boton-menu" />

                                <p:button value="Tipos de característica"
                                          outcome="/paginas/TipoCaracteristica.xhtml"
                                          icon="pi pi-sliders-h"
                                          styleClass="boton-menu" />


                                <!-- PROMOCIONES -->
                                <div class="menu-seccion">
                                    Promociones
                                </div>

                                <p:button value="Descuentos"
                                          outcome="/paginas/Descuento.xhtml"
                                          icon="pi pi-percentage"
                                          styleClass="boton-menu" />

                                <p:button value="Tipos de descuento"
                                          outcome="/paginas/TipoDescuento.xhtml"
                                          icon="pi pi-ticket"
                                          styleClass="boton-menu" />


                                <!-- ADMINISTRACIÓN -->
                                <div class="menu-seccion">
                                    Administración
                                </div>
                                <p:button value="Empleados"
                                          outcome="/paginas/Empleado.xhtml"
                                          icon="pi pi-id-card"
                                          styleClass="boton-menu" />
                                <p:button value="Roles"
                                          outcome="/paginas/Rol.xhtml"
                                          icon="pi pi-users"
                                          styleClass="boton-menu" />

                            </div>

                        </div>
                    </div>

                    <!-- ÁREA PRINCIPAL -->
                    <div id="areaPrincipal"
                         class="col-12 md:col-10">

                        <!-- TABLA -->
                        <h:panelGroup id="pnlTablaContainer"
                                      layout="block"
                                      rendered="#{!controller.nuevo and !controller.editando and !controller.consultando}">



                            <ui:insert name="tabla" />

                            <div class="mt-3">

                                <p:commandButton
                                    value="Nuevo #{nombreEntidad}"
                                    actionListener="#{controller.btnNuevoHandler}"
                                    update=":frmPrincipal"
                                    process="@this"
                                    resetValues="true"
                                    icon="pi pi-plus"
                                    styleClass="ui-button-primary mr-2" />

                                <ui:insert name="accionesListadoEspeciales" />

                                <p:commandButton
                                    value="Editar"
                                    actionListener="#{controller.btnModificarHandler}"
                                    update=":frmPrincipal"
                                    process="@this"
                                    icon="pi pi-pencil"
                                    styleClass="mr-2"
                                    rendered="#{controller.puedeEditar}" />

                                <p:commandButton
                                    value="Eliminar"
                                    actionListener="#{controller.btnEliminarHandler}"
                                    update=":frmPrincipal"
                                    process="@this"
                                    icon="pi pi-trash"
                                    styleClass="ui-button-danger mr-2"
                                    rendered="#{controller.puedeEliminar}">

                                    <p:confirm
                                        header="Confirmar eliminación"
                                        message="¿Está seguro de que desea eliminar este registro?"
                                        icon="pi pi-exclamation-triangle" />

                                </p:commandButton>

                                <p:commandButton
                                    value="Cancelar"
                                    actionListener="#{controller.btnCancelarHandler}"
                                    update=":frmPrincipal"
                                    process="@this"
                                    resetValues="true"
                                    styleClass="ui-button-secondary"
                                    icon="pi pi-times" 
                                    rendered="#{controller.registro != null}" />

                            </div>

                        </h:panelGroup>


                        <!-- FORMULARIO NUEVO / EDICIÓN -->
                        <h:panelGroup id="pnlFormularioContainer"
                                      layout="block"
                                      rendered="#{controller.nuevo or controller.editando or controller.consultando}">

                            <p:panel header="Datos de #{nombreEntidad}">



                                <!--
                                    Cada página define aquí
                                    los campos propios de su entidad.
                                -->
                                <ui:insert name="formulario" />

                                <f:facet name="footer">

                                    <p:commandButton
                                        value="Guardar"
                                        actionListener="#{controller.btnGuardarHandler}"
                                        update=":frmPrincipal"
                                        process="@form"
                                        icon="pi pi-check"
                                        styleClass="mr-2">

                                        <p:confirm
                                            header="Confirmar modificación"
                                            message="¿Está seguro de que desea guardar los cambios realizados?"
                                            icon="pi pi-exclamation-triangle"
                                            disabled="#{controller.nuevo}" />

                                    </p:commandButton>

                                    <p:commandButton
                                        value="Cancelar"
                                        actionListener="#{controller.btnCancelarHandler}"
                                        update=":frmPrincipal"
                                        process="@this"
                                        resetValues="true"
                                        icon="pi pi-times"
                                        styleClass="ui-button-secondary"
                                        rendered="#{controller.registro != null}" />

                                </f:facet>

                            </p:panel>

                        </h:panelGroup>

                    </div>

                </div>


                <!-- CONFIRMACIÓN GLOBAL -->
                <p:confirmDialog global="true"
                                 showEffect="fade"
                                 hideEffect="fade"
                                 responsive="true"
                                 width="350">

                    <p:commandButton
                        value="No"
                        type="button"
                        styleClass="ui-confirmdialog-no ui-button-secondary"
                        icon="pi pi-times" />

                    <p:commandButton
                        value="Sí"
                        type="button"
                        styleClass="ui-confirmdialog-yes ui-button-danger"
                        icon="pi pi-check" />

                </p:confirmDialog>


                <!-- PIE DE PÁGINA -->
                <div class="col-12 mt-5 pt-3 border-top-1 surface-border text-color-secondary text-sm">

                    © Todos los derechos reservados CAFEFE 2026

                </div>

            </div>

        </h:form>

    </h:body>

</html>
